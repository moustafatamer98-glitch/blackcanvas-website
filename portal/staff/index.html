}
function closeDrawer() { const d = $('#drawer'); d.classList.remove('on'); $('#scrim').classList.remove('on'); d.setAttribute('aria-hidden', 'true'); drawerState = null; }
const clashList = list => `<ul>${list.map(b => `<li>${esc(projName(b.projectId))} · ${esc(fmtShort(b.from))}–${esc(fmtShort(b.to))}${b.status === 'hold' ? ' (on hold)' : ''}</li>`).join('')}</ul>`;

/* ---- position drawer (a line on the staff list, with its budget) ---- */
function positionDrawer(posId, projectId) {
  const isNew = !posId, p0 = posId ? db.positions.get(posId) : null;
  if (posId && !p0) return;
  const proj = getProject(p0?.projectId || projectId), w = windowOf(proj);
  const ps = p0 ? structuredClone(p0) : { id: uid(), projectId, title: '', dept: '', from: w.from || today(), to: w.to || w.from || today(), rateType: 'day', rate: '', perDiem: '', accommodation: '', travel: '', other: '', note: '', qty: 1 };
  const as = posAssigns(ps.id), liveAs = as.filter(live);
  const fields = [
    { k: 'title', label: 'Position', list: 'dlTitles', placeholder: 'e.g. Production coordinator', span: !isNew },
    ...(isNew ? [{ k: 'qty', label: 'How many', type: 'number', min: 1 }] : []),
    { k: 'dept', label: 'Department', type: 'select', options: [['', 'From the position'], ...DEPTS.map(d => [d, d])] },
    { k: 'note', label: 'Note', placeholder: 'e.g. Arabic speaker, VIP area' },
    { k: 'from', label: 'From', type: 'date' }, { k: 'to', label: 'To', type: 'date', hint: w.from ? `Project: ${esc(fmtRange(w.from, w.to))}` : '' },
    { sect: 'Budget per person' },
    ...allowanceFields(),
  ];
  const preview = () => {
    const o = readForm($('#drBody').querySelector('.form'), ps), c = costOf(o), q = isNew ? Math.max(1, Math.round(num(o.qty)) || 1) : 1;
    $('#posPrev').innerHTML = c.days ? `<span class="eyebrow">Budget</span><span class="big num">${money(c.total * q)}</span><span class="muted">${q > 1 ? `${q} × ${money(c.total)} · ` : ''}${plural(c.days, 'day')} · fee ${money(c.fee)}${c.extras ? ` + allowances ${money(c.extras)}` : ''} per person</span>` : '<span class="muted">Set the dates to see the budget.</span>';
  };
  openDrawer({
    title: isNew ? `Add positions · ${proj?.name || ''}` : `${ps.title || 'Position'} · ${proj?.name || ''}`, wide: true,
    body: `<div class="form">${formHTML(fields, ps)}</div><div class="preview" id="posPrev"></div>
      ${!isNew && as.length ? `<div class="sect" style="margin-top:18px;border-top:1px solid var(--line);padding-top:14px"><div class="eyebrow" style="margin-bottom:6px">On this position</div>${as.map(a => `<div class="bk" data-act="asg" data-id="${esc(a.id)}"><span class="num">${esc(fmtShort(a.from))} – ${esc(fmtShort(a.to))}</span><span><b>${esc(staffName(a.staffId))}</b></span><span class="issue ${a.status === 'confirmed' ? 'ok' : a.status === 'released' ? 'info' : 'warn'}">${esc(label(A_STATUS, a.status || 'hold'))}</span></div>`).join('')}
        <p class="dim" style="font-size:12px;margin-top:8px">If you change the dates, people booked for the whole position move with it.</p></div>` : ''}`,
    extra: isNew ? '' : `<button class="btn" data-act="pick" data-id="${esc(ps.id)}">+ Assign</button><button class="btn" data-act="dupPos" data-id="${esc(ps.id)}">Duplicate</button>`,
    saveLabel: isNew ? 'Add' : 'Save',
    onInput: preview,
    onSave: async () => {
      const o = readForm($('#drBody').querySelector('.form'), ps);
      if (!o.title) return toast('Name the position', true);
      if (!o.from || !o.to) return toast('Set the dates', true);
      if (o.to < o.from) return toast('The end date is before the start date', true);
      if (!o.dept) o.dept = deptOf(o.title) || 'Other';
      const now = new Date().toISOString();
      if (isNew) {
        const q = Math.min(50, Math.max(1, Math.round(num(o.qty)) || 1)); delete o.qty;
        const rows = Array.from({ length: q }, (_, i) => { const id = i ? uid() : o.id; return { coll: 'positions', id, data: { ...o, id, n: i, createdAt: now } }; });
        try { await Backend.putMany(rows); closeDrawer(); render(); toast(q > 1 ? `${q} positions added` : 'Position added'); } catch (err) { failed(err); }
        return;
      }
      delete o.qty;
      // people booked for the whole position move with its dates
      const moved = (o.from !== ps.from || o.to !== ps.to) ? liveAs.filter(a => a.from === ps.from && a.to === ps.to).map(a => ({ ...a, from: o.from, to: o.to })) : [];
      for (const a of moved) {
        const c = clashesFor(a.staffId, a.from, a.to, a.id);
        if (c.length) return confirmDialog({ title: 'Can’t move these dates', body: `<p><b>${esc(staffName(a.staffId))}</b> would overlap with:</p>${clashList(c)}<p>Change their booking first, or pick other dates.</p>`, ok: 'OK', cancel: false });
      }
      try { await Backend.putMany([{ coll: 'positions', id: o.id, data: o }, ...moved.map(a => ({ coll: 'assign', id: a.id, data: a }))]); closeDrawer(); render(); toast(moved.length ? `Saved · ${plural(moved.length, 'booking')} moved` : 'Saved'); } catch (err) { failed(err); }
    },
    onDelete: isNew ? null : async () => {
      if (as.length && await confirmDialog({ title: `Delete “${ps.title}”?`, body: `<p>${plural(as.length, 'booking')} on this position will be removed too.</p>`, ok: 'Delete', danger: true }) !== 'ok') return;
      try { await Backend.delMany('assign', as.map(a => a.id)); await Backend.delMany('positions', [ps.id]); closeDrawer(); render(); toast('Position deleted'); } catch (err) { failed(err); }
    },
  });
  preview();
}

/* ---- assign picker ---- */
function pickDrawer(posId) {
  const ps = db.positions.get(posId); if (!ps) return;
  const proj = getProject(ps.projectId), cv = coverage(ps), g = cv.gaps[0] || { from: ps.from, to: ps.to };
  const st = { from: g.from, to: g.to, status: ui.newStatus, sel: null };
  const title = (ps.title || '').toLowerCase();
  ui.pickQ = '';
  ui.pickAll = ![...db.staff.values()].some(s => s.active !== false && staffTitles(s).includes(title));
  const estimate = s => costOf({ ...ps, rateType: s.rateType || 'day', rate: num(s.rate) ? s.rate : ps.rate, from: st.from, to: st.to }).total;
  const listHTML = () => {
    IDX = null;
    const q = ui.pickQ.trim().toLowerCase(), ok = st.from && st.to && st.to >= st.from;
    const bud = costOf({ ...ps, from: st.from, to: st.to }).total;
    const cands = [...db.staff.values()].filter(s => s.active !== false)
      .filter(s => !q || [s.name, s.title, s.city, ...(s.skills || [])].join(' ').toLowerCase().includes(q))
      .map(s => { const iss = ok ? issuesFor(s.id, st.from, st.to) : []; return { s, match: staffTitles(s).includes(title), iss, busy: iss.some(i => i.lvl === 'bad'), est: ok ? estimate(s) : 0 }; })
      .filter(x => ui.pickAll || x.match || st.sel === x.s.id)
      .sort((x, y) => (x.busy - y.busy) || (y.match - x.match) || (x.iss.length - y.iss.length) || sortStaff(x.s, y.s));
    if (st.sel && cands.find(x => x.s.id === st.sel)?.busy) st.sel = null;
    const row = x => `<div class="pick ${x.busy ? 'dis' : st.sel === x.s.id ? 'sel' : ''}" ${x.busy ? 'aria-disabled="true"' : `data-act="pickSel" data-id="${esc(x.s.id)}"`}>

      <div style="min-width:0"><div class="nm">${esc(x.s.name)}</div>
        <div class="rl">${esc([x.s.title, ...(x.s.skills || [])].filter(Boolean).join(' · ') || '—')} · ${esc(label(STAFF_TYPES, x.s.type || 'employee'))}${x.s.city ? ' · ' + esc(x.s.city) : ''}</div>
        <div class="issues">${x.iss.length ? issueTags(x.iss) : '<span class="issue ok">Free</span>'}</div></div>
      <div class="rate num">${rateHTML(x.s.rateType, x.s.rate)}${ok && !x.busy ? `<b>${money(x.est)}</b><span style="color:${x.est > bud + 0.5 ? 'var(--red)' : 'var(--green)'}">${x.est > bud + 0.5 ? `${money(x.est - bud)} over` : x.est < bud - 0.5 ? `${money(bud - x.est)} under` : 'on budget'}</span>` : ''}</div></div>`;
    const free = cands.filter(x => !x.busy), busy = cands.filter(x => x.busy);
    const fm = free.filter(x => x.match), fo = free.filter(x => !x.match);
    return `<div class="pick-info"><span><b>${esc(ps.title)}</b> · ${esc(proj?.name || '')} · position ${esc(fmtRange(ps.from, ps.to))}</span><span>Budget for these dates <b class="num">${ok ? money(bud) : '—'}</b></span></div>
      ${!ok ? '<div class="empty" style="padding:20px"><b>Check the dates</b>The end date is before the start date.</div>' : ''}
      ${!db.staff.size ? `<div class="empty"><b>No staff yet</b>Add people on the Staff page first.<br><br><a class="btn primary" href="#/staff" data-act="closeDrawer">${ICON.users} Go to Staff</a></div>` : ''}
      ${ok && fm.length ? `<div class="pick-sect">Free · ${esc(ps.title)}</div>${fm.map(row).join('')}` : ''}
      ${ok && fo.length ? `<div class="pick-sect">Free · other positions</div>${fo.map(row).join('')}` : ''}
      ${ok && busy.length ? `<div class="pick-sect">Not available — already on another project</div>${busy.map(row).join('')}` : ''}
      ${ok && db.staff.size && !cands.length ? `<div class="empty" style="margin-top:10px"><b>No one listed</b>${ui.pickAll ? 'No staff match your search.' : `No one has “${esc(ps.title)}” as a position. Tick “Show all staff” to pick from everyone.`}</div>` : ''}`;
  };
  const paint = () => {
    $('#pickList').innerHTML = listHTML();
    const b = $('#drSaveBtn'); if (b) { b.textContent = st.sel ? `Assign ${firstName(st.sel)}` : 'Assign'; b.disabled = !st.sel; }
  };
  openDrawer({
    title: `Assign · ${ps.title || 'Position'}`, wide: true,
    body: `<div class="pick-top">
        <div class="f"><label for="pkFrom">From</label><input class="input" type="date" id="pkFrom" value="${esc(st.from)}" data-pk="from"></div>
        <div class="f"><label for="pkTo">To</label><input class="input" type="date" id="pkTo" value="${esc(st.to)}" data-pk="to"></div>
        <div class="f"><label for="pkSt">Book as</label><select class="input" id="pkSt" data-pk="status"><option value="hold" ${st.status === 'hold' ? 'selected' : ''}>On hold</option><option value="confirmed" ${st.status === 'confirmed' ? 'selected' : ''}>Confirmed</option></select></div>
      </div>
      <div style="display:flex;gap:10px;align-items:center;margin-bottom:6px;flex-wrap:wrap"><input class="input" id="pickQ" placeholder="Search staff…" data-pick="q" autocomplete="off" style="flex:1;min-width:180px"><label class="check"><input type="checkbox" data-pick="all" ${ui.pickAll ? 'checked' : ''}> Show all staff, not only this position</label></div>
      <div id="pickList"></div>`,
    saveLabel: 'Assign',
    onSave: async () => {
      if (!st.sel) return toast('Pick someone', true);
      if (!st.from || !st.to || st.to < st.from) return toast('Check the dates', true);
      const s = db.staff.get(st.sel), c = clashesFor(st.sel, st.from, st.to);
      if (c.length) return confirmDialog({ title: 'Can’t book this', body: `<p><b>${esc(s.name)}</b> is already on:</p>${clashList(c)}`, ok: 'OK', cancel: false });
      const lv = leaveFor(st.sel, st.from, st.to);
      if (lv.length && await confirmDialog({ title: `${s.name} is on leave`, body: `<p>They’re on leave ${esc(fmtShort(lv[0].from))}–${esc(fmtShort(lv[0].to || lv[0].from))}${lv[0].note ? ` (${esc(lv[0].note)})` : ''}. Assign them anyway?</p>`, ok: 'Assign anyway' }) !== 'ok') return;
      const id = uid();
      const a = { id, projectId: ps.projectId, positionId: ps.id, staffId: st.sel, title: ps.title, from: st.from, to: st.to, status: st.status,
        rateType: s.rateType || 'day', rate: num(s.rate) ? s.rate : ps.rate, perDiem: ps.perDiem, accommodation: ps.accommodation, travel: ps.travel, other: ps.other,
        note: '', createdAt: new Date().toISOString(), createdBy: me };
      try { await Backend.put('assign', id, a); closeDrawer(); render(); toast(`${s.name} assigned (${label(A_STATUS, st.status).toLowerCase()})`); } catch (err) { failed(err); }
    },
    refresh: () => paint(),
  });
  Object.assign(drawerState, { pick: { st, paint } });
  paint();
}

/* ---- booking drawer ---- */
function waText(a) {

  return `Hi ${firstName(a.staffId)}, this is Black Canvas. You're ${a.status === 'confirmed' ? 'confirmed' : 'pencilled in'} as ${a.title || 'staff'} on ${p?.name || 'our project'}${p?.venue ? ' at ' + p.venue : ''}${p?.city ? ', ' + p.city : ''} from ${fmt(a.from, {weekday:'short', day:'numeric', month:'short'})} to ${fmt(a.to, {weekday:'short', day:'numeric', month:'short'})}. Please reply to confirm. Thank you!`;
}
function asgDrawer(aId) {
  const a = db.assign.get(aId); if (!a) return;

    const c = costOf(o), b = ps.id ? costOf({ ...ps, from: o.from, to: o.to }).total : 0;

        <span class="eyebrow" style="margin-top:4px">Booking cost</span><span class="big num">${money(live(o) ? c.total : 0)}</span>
        <span class="muted">${plural(c.days, 'day')} · fee ${money(c.fee)}${c.extras ? ` + allowances ${money(c.extras)}` : ''}${b && live(o) ? ` · budget ${money(b)} · ${c.total > b + 0.5 ? `<span class="var-neg">${money(c.total - b)} over</span>` : `<span class="var-pos">${money(b - c.total)} under</span>`}` : ''}${!live(o) ? ' · released, not counted' : ''}</span>`;

      <div class="form">${formHTML(fields, a)}</div><div class="preview" id="asgPrev"></div>

        <button class="btn ghost" data-act="staff" data-id="${esc(a.staffId)}">Open profile</button>

      try { await Backend.put('assign', o.id, o); closeDrawer(); render(); toast('Booking saved'); } catch (err) { failed(err); }

/* ---- import staff from a pasted list ---- */
const IMPORT_COLS = [['name', ['name', 'full name']], ['title', ['position', 'title', 'role', 'job']], ['dept', ['department', 'dept']], ['phone', ['phone', 'mobile', 'number', 'whatsapp']], ['email', ['email', 'e-mail']], ['type', ['type']], ['rate', ['rate', 'salary', 'day rate', 'amount']], ['rateType', ['rate type', 'pay', 'per']], ['city', ['city', 'based']]];
function parseStaffList(text) {
  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  if (!lines.length) return [];
  const sep = lines[0].includes('\t') ? '\t' : lines[0].includes(';') && !lines[0].includes(',') ? ';' : ',';
  const split = l => { const out = []; let cur = '', q = false; for (const ch of l) { if (ch === '"') q = !q; else if (ch === sep && !q) { out.push(cur.trim()); cur = ''; } else cur += ch; } out.push(cur.trim()); return out; };
  let rows = lines.map(split), cols = IMPORT_COLS.map(c => c[0]);
  const head = rows[0].map(h => h.toLowerCase());
  if (head.some(h => IMPORT_COLS.some(([, names]) => names.includes(h)))) {
    cols = head.map(h => (IMPORT_COLS.find(([, names]) => names.includes(h)) || [null])[0]);
    rows = rows.slice(1);
  }
  return rows.map(r => { const o = {}; cols.forEach((k, i) => { if (k && r[i]) o[k] = r[i]; }); return o; }).filter(o => o.name);
}
function importDrawer() {
  openDrawer({
    title: 'Import staff', wide: true,
    body: `<p class="muted" style="margin-top:0">Copy rows from Excel or Google Sheets and paste them here. Use these columns, in this order or with a header row: <b style="color:var(--text)">Name, Position, Department, Phone, Email, Type, Rate, Rate type, City</b>. Only the name is required. Type is employee, freelancer, contractor or agency; rate type is month, day or fixed.</p>
      <textarea class="input" id="impText" style="min-height:220px;font-family:var(--mono);font-size:12px" placeholder="Name, Position, Department, Phone, Email, Type, Rate, Rate type, City&#10;Sara Ali, Project manager, Management, 0551234567, , employee, 18000, month, Riyadh"></textarea>
      <div id="impPrev" class="dim" style="margin-top:10px;font-size:13px"></div>`,
    saveLabel: 'Import',
    onSave: async () => {
      const list = parseStaffList($('#impText').value);
      if (!list.length) return toast('Paste at least one row with a name', true);
      const known = new Set([...db.staff.values()].flatMap(s => [s.name.toLowerCase(), waNumber(s.phone)].filter(Boolean)));
      const now = new Date().toISOString(), rows = [];
      let skipped = 0;
      for (const o of list) {
        if (known.has(o.name.toLowerCase()) || (o.phone && known.has(waNumber(o.phone)))) { skipped++; continue; }
        const id = uid(), lc = v => String(v || '').toLowerCase();
        const type = (STAFF_TYPES.find(([k, l]) => [k, l.toLowerCase()].includes(lc(o.type))) || [lc(o.type).startsWith('free') ? 'freelance' : 'employee'])[0];
        const rt = /day|daily/.test(lc(o.rateType)) ? 'day' : /fix|project/.test(lc(o.rateType)) ? 'fixed' : /month/.test(lc(o.rateType)) ? 'month' : type === 'employee' ? 'month' : 'day';
        const dept = DEPTS.find(d => d.toLowerCase() === lc(o.dept)) || deptOf(o.title) || '';
        rows.push({ coll: 'staff', id, data: { id, name: o.name, title: o.title || '', skills: [], dept, type, phone: o.phone || '', email: o.email || '', city: o.city || '', rateType: rt, rate: Number(String(o.rate || '').replace(/[^\d.]/g, '')) || '', away: [], notes: '', active: true, createdAt: now } });
        known.add(o.name.toLowerCase());
      }
      if (!rows.length) return toast('Everyone in the list is already in the database', true);
      try { await Backend.putMany(rows); closeDrawer(); render(); toast(`${plural(rows.length, 'person', 'people')} imported${skipped ? ` · ${skipped} already listed` : ''}`); } catch (err) { failed(err); }
    },
  });
}

/* ---- CSV export ---- */
function exportCsv(pid) {
  const p = getProject(pid);
  const cell = v => /[",\n]/.test(String(v ?? '')) ? `"${String(v).replace(/"/g, '""')}"` : String(v ?? '');
  const C = CONFIG.CURRENCY;
  const rows = [['Department', 'Position', 'Name', 'Phone', 'Type', 'From', 'To', 'Days', 'Status', 'Rate type', `Rate (${C})`, `Fee (${C})`, `Per diems (${C})`, `Accommodation (${C})`, `Travel (${C})`, `Other (${C})`, `Booked cost (${C})`, `Position budget (${C})`]];
  const r2 = n => Math.round(n * 100) / 100;
  for (const ps of idx().byProject.get(pid) || []) {
    const as = posAssigns(ps.id).filter(live), b = costOf(ps).total;
    if (!as.length) rows.push([ps.dept, ps.title, '(open)', '', '', ps.from, ps.to, daysIn(ps.from, ps.to), 'Open', label(RATE_TYPES, ps.rateType || 'day'), ps.rate, '', '', '', '', '', 0, r2(b)]);
    as.forEach((a, i) => {
      const s = db.staff.get(a.staffId) || {}, c = costOf(a);
      rows.push([ps.dept, ps.title, staffName(a.staffId), s.phone, label(STAFF_TYPES, s.type || 'employee'), a.from, a.to, c.days, label(A_STATUS, a.status || 'hold'), label(RATE_TYPES, a.rateType || 'day'), a.rate, r2(c.fee), r2(c.perDiem), r2(c.acc), r2(c.travel), r2(c.other), r2(c.total), i ? '' : r2(b)]);
    });
  }
  const blob = new Blob(['﻿' + rows.map(r => r.map(cell).join(',')).join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob), link = document.createElement('a');
  link.href = url; link.download = `${(p?.code || p?.name || 'project').replace(/[^\w-]+/g, '-')}-staff.csv`;
  document.body.appendChild(link); link.click(); link.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000);
}

/* ---------------- confirm dialog ---------------- */
function confirmDialog({ title, body, ok = 'Confirm', danger = false, alt = null, cancel = true }) {
  return new Promise(resolve => {
    const m = document.createElement('div');
    m.className = 'modal'; m.setAttribute('role', 'alertdialog'); m.setAttribute('aria-modal', 'true');
    m.innerHTML = `<div class="modal-box"><h2>${esc(title)}</h2>${body}
      <div class="acts">${cancel ? '<button class="btn ghost" data-r="cancel">Cancel</button>' : ''}${alt ? `<button class="btn" data-r="alt">${esc(alt)}</button>` : ''}<button class="btn ${danger ? 'danger-solid' : 'primary'}" data-r="ok">${esc(ok)}</button></div></div>`;
    const done = r => { m.remove(); document.removeEventListener('keydown', key, true); resolve(r); };
    const key = e => { if (e.key === 'Escape') { e.stopPropagation(); done('cancel'); } };
    m.addEventListener('click', e => { const b = e.target.closest('[data-r]'); if (b) done(b.dataset.r); else if (e.target === m) done('cancel'); });
    document.addEventListener('keydown', key, true);
    document.body.appendChild(m);
    m.querySelector(cancel ? '[data-r=cancel]' : '[data-r=ok]').focus();
  });
}

let toastT;
function toast(msg, err = false) { const t = $('#toast'); t.textContent = msg; t.className = 'toast on' + (err ? ' err' : ''); clearTimeout(toastT); toastT = setTimeout(() => t.className = 'toast', err ? 4200 : 2200); }

/* =========================================================================
   Boot
   ========================================================================= */
function leave(to) { location.replace(CONFIG.PORTAL_HOME + to); }

async function start() {
  try {
    if (DEMO) { me = 'you@blackcanvasglobal.com'; myName = 'You'; }
    else {
      if (!sb) throw new Error('The portal connection settings are missing (config.js).');
      const { data: { session } } = await sb.auth.getSession();
      if (!session) return leave('?next=staff');
      me = (session.user.email || '').toLowerCase();
      myName = BCPortal.displayName(session.user);
      sb.auth.onAuthStateChange((ev, ses) => { if (ev === 'SIGNED_OUT' || (!ses && ev !== 'INITIAL_SESSION')) leave(''); });
      const { data: access, error } = await sb.rpc('my_access');
      if (error) { if (/jwt/i.test(error.message || '')) return leave('?next=staff'); throw error; }
      if (!(access?.apps || []).includes('staff')) return leave('?noaccess=staff');
      BCPortal.accessBanner(access);
    }
    await Backend.load();
    Backend.subscribe();
    shell();
  } catch (e) {
    console.error(e);
    $('#app').innerHTML = `<div class="loading"><div style="text-align:center"><b>Couldn’t load Staff</b><br><span class="muted">${esc(e.message || e)}</span><br><br><button class="btn" onclick="location.reload()">Try again</button></div></div>`;
  }
}
