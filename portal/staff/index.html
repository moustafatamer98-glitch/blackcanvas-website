<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="../../card/apple-touch-icon.png">
<title>Black Canvas Staff</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..100,400..900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* same palette as the portal, Billing and Projects */
  --bg:#0B0B0C; --panel:#141416; --panel2:#1D1D21; --raise:#24242A; --line:#2B2B30; --line2:#45454B;
  --text:#F4F3EF; --muted:#9C9EA3; --dim:#66686D;
  --orange:#F04E23; --orange-soft:rgba(240,78,35,.14);
  --red:#FF7086; --amber:#E6B450; --blue:#7FA2FF; --violet:#B39BFF; --green:#5BC994; --white:#F4F3EF;
  --radius:6px; --side:220px;
  --font:'Archivo',Arial,sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.num{font-variant-numeric:tabular-nums}
.hidden{display:none!important}

/* ---------- logo ---------- */
.logo-svg{display:block;width:150px;color:var(--text)}
.logo-svg svg{display:block;width:100%;height:auto}
.logo{font-weight:900;font-stretch:80%;letter-spacing:.01em;line-height:.9;font-size:20px;text-transform:uppercase;user-select:none}
.logo .o{color:transparent;-webkit-text-stroke:1.1px var(--text)}
.logo .dot{display:inline-block;width:.32em;height:.32em;background:var(--orange);margin-left:.08em}
.logo-sub{font-size:10px;letter-spacing:.28em;color:var(--muted);text-transform:uppercase;margin-top:6px;font-weight:600}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:22px;background:var(--bg)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:500}
.nav a:hover{background:var(--panel2);color:var(--text)}
.nav a.on{background:var(--panel2);color:var(--text)}
.nav a.on svg{color:var(--orange)}
.nav svg{width:17px;height:17px;flex:none}
.nav .count{margin-left:auto;font-size:11px;background:var(--red);color:#fff;border-radius:20px;padding:0 6px;font-weight:700}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;font-size:12px;color:var(--muted)}
.side-foot a{text-decoration:none}
.side-foot a:hover{color:var(--text)}
.me{display:flex;align-items:center;gap:8px}
main{min-width:0;padding:28px 34px 80px}
.demo-bar{background:var(--orange-soft);color:var(--orange);border:1px solid rgba(240,78,35,.35);padding:7px 12px;border-radius:8px;font-size:12px;margin-bottom:18px;font-weight:600}

/* ---------- type ---------- */
h1{font-size:40px;font-weight:900;font-stretch:62.5%;text-transform:uppercase;letter-spacing:.005em;margin:0;line-height:1}
h2{font-size:15px;font-weight:700;margin:0;text-transform:uppercase;letter-spacing:.06em;font-stretch:90%}
.eyebrow{font:500 11px/1.3 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .dim{color:var(--dim)}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);background:var(--panel2);padding:8px 13px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:#4a4a4a;background:var(--raise)}
.btn.primary{background:var(--orange);border-color:var(--orange);color:#0a0a0a}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--text);background:var(--panel2)}
.btn.danger{color:var(--red);border-color:rgba(255,77,79,.4);background:transparent}
.btn.sm{padding:5px 9px;font-size:12px}
.btn svg{width:15px;height:15px}
.input,select.input,textarea.input{width:100%;background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;outline:none}
.input:focus{border-color:var(--orange)}
textarea.input{resize:vertical;min-height:84px}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
input[type=date].input,input[type=time].input{color-scheme:dark}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 11px;cursor:pointer;color:var(--muted);font-size:12px;font-weight:600}
.seg button.on{background:var(--raise);color:var(--text)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:transparent;border-radius:30px;padding:5px 12px;font-size:12px;cursor:pointer;color:var(--muted);font-weight:600}
.chip.on{background:var(--text);color:#0a0a0a;border-color:var(--text)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.toolbar .grow{flex:1;min-width:180px}
.check{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;cursor:pointer;user-select:none}

/* ---------- pills ---------- */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;border-radius:20px;border:1px solid currentColor;white-space:nowrap;line-height:1.3}
.pill::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.s-pitch{color:var(--muted)} .s-confirmed{color:var(--white)} .s-preprod{color:var(--blue)} .s-build{color:var(--amber)}
.s-live{color:var(--orange)} .s-derig{color:var(--violet)} .s-wrap{color:var(--green)} .s-closed{color:var(--dim)} .s-lost{color:var(--red)}
.s-live::before{animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}
.tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:5px;background:var(--raise);color:var(--muted);white-space:nowrap;font-weight:500}
.prio{width:8px;height:8px;border-radius:2px;flex:none;display:inline-block}
.p-low{background:var(--dim)} .p-normal{background:var(--blue)} .p-high{background:var(--amber)} .p-critical{background:var(--red)}

select.status-sel{width:auto;padding:4px 28px 4px 12px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;border-radius:20px;border-color:currentColor;background-color:transparent}
select.status-sel option{color:var(--text);background:var(--panel)}
/* ---------- KPI & cards ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.kpi .v{font-size:30px;font-weight:800;font-stretch:80%;line-height:1;margin-top:8px}
.kpi.alert .v{color:var(--red)}
.hero{display:grid;grid-template-columns:auto 1fr auto;gap:22px;align-items:center;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--orange);border-radius:var(--radius);padding:18px 22px;margin-bottom:22px;cursor:pointer}
.hero:hover{border-color:var(--line2);border-left-color:var(--orange)}
.hero .big{font-size:56px;font-weight:900;font-stretch:72%;line-height:.85;color:var(--orange)}
.hero .big small{display:block;font-size:11px;letter-spacing:.2em;color:var(--muted);font-stretch:100%;font-weight:600;margin-top:6px;text-transform:uppercase}
.hero .t{font-size:22px;font-weight:800;font-stretch:82%;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden;text-align:left}
.card:hover{border-color:var(--line2);background:var(--panel2)}
.card .name{font-size:18px;font-weight:800;font-stretch:84%;text-transform:uppercase;line-height:1.1}
.card .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.bar{height:4px;background:var(--raise);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--text)}
.bar.o i{background:var(--orange)}
.meta{display:flex;gap:12px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.meta .bad{color:var(--red);font-weight:600}
.empty{border:1px dashed var(--line2);border-radius:var(--radius);padding:40px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--text);font-size:15px;margin-bottom:4px}

.av{width:24px;height:24px;border-radius:50%;background:var(--raise);border:1px solid var(--line2);display:inline-grid;place-items:center;font-size:10px;font-weight:700;color:var(--text);flex:none;letter-spacing:0}
.av.me{border-color:var(--orange);color:var(--orange)}
.av.none{border-style:dashed;color:var(--dim)}

/* ---------- event header ---------- */
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;font-size:13px;margin-bottom:14px}
.back:hover{color:var(--text)}
.ev-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;flex-wrap:wrap;margin-bottom:18px}
.ev-head h1{font-size:52px}
.phases{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:18px}
.phase{background:var(--panel);padding:12px 14px}
.phase .d{font-size:15px;font-weight:700;margin-top:4px}
.phase.now{background:var(--panel2);box-shadow:inset 0 2px 0 var(--orange)}
.countdown{text-align:right}
.countdown .big{font-size:44px;font-weight:900;font-stretch:72%;line-height:.9;color:var(--orange);text-transform:uppercase}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs a{padding:10px 14px;text-decoration:none;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs a.on{color:var(--text);border-color:var(--orange)}
.tabs a .n{font-size:11px;color:var(--dim);margin-left:4px}
.depts{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px 18px;margin-bottom:20px}
.dept-row{display:grid;grid-template-columns:1fr auto;gap:2px 8px;font-size:12px}
.dept-row .bar{grid-column:1/-1}

/* ---------- timeline ---------- */
.tl-wrap{border:1px solid var(--line);border-radius:var(--radius);overflow:auto;background:var(--panel);max-height:calc(100vh - 210px)}
.tl{position:relative;display:grid}
.tl-head,.tl-row{display:flex}
.tl-label{position:sticky;left:0;z-index:3;width:230px;flex:none;background:var(--panel);border-right:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;justify-content:center;cursor:pointer}
.tl-label:hover .n{color:var(--orange)}
.tl-label .n{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-label .c{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-head{position:sticky;top:0;z-index:4;background:var(--panel);border-bottom:1px solid var(--line2)}
.tl-head .tl-label{z-index:5}
.tl-days{position:relative;flex:none}
.tl-month{position:absolute;top:0;height:22px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;padding:4px 6px;border-left:1px solid var(--line2);color:var(--muted);white-space:nowrap}
.tl-day{position:absolute;top:22px;height:24px;font-size:10px;text-align:center;color:var(--dim);line-height:24px}
.tl-day.we{color:var(--muted)}
.tl-day.today{color:var(--orange);font-weight:800}
.tl-track{position:relative;flex:none;border-bottom:1px solid var(--line);height:52px}
.tl-we{position:absolute;top:0;bottom:0;background:rgba(255,255,255,.025)}
.tl-today{position:absolute;top:0;bottom:0;width:2px;background:var(--orange);z-index:2;pointer-events:none}
.tl-bar{position:absolute;top:15px;height:22px;border-radius:4px;cursor:pointer;display:flex;align-items:center;padding:0 7px;font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden}
.tl-bar.b{background:#3a3a37;color:#cfcfcb}
.tl-bar.s{background:var(--orange);color:#0a0a0a;z-index:1}
.tl-bar.d{background:repeating-linear-gradient(135deg,#2c2c2a 0 5px,#383836 5px 10px);color:#b0b0ac}
.tl-ms{position:absolute;top:8px;width:9px;height:9px;background:var(--red);transform:rotate(45deg);z-index:2;cursor:pointer;border:1px solid var(--panel)}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);align-items:center;flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}

/* ---------- remove buttons ---------- */
.card-x{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:6px;border:1px solid var(--line2);background:var(--panel);color:var(--muted);display:grid;place-items:center;cursor:pointer;opacity:0;transition:opacity .15s;z-index:2;padding:0}
.card-x svg{width:15px;height:15px}
.card:hover .card-x,.card:focus-within .card-x{opacity:1}
.card-x:hover{color:var(--red);border-color:var(--red)}
.card.has-x .row:first-child{padding-right:36px}
@media (hover:none){.card-x{opacity:1}}
.ev-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
/* ---------- confirm dialog ---------- */
.modal{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:16px;background:rgba(0,0,0,.65)}
.modal-box{width:min(440px,100%);background:var(--panel);border:1px solid var(--line2);border-radius:var(--radius);padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal-box h2{font-size:16px}
.modal-box p{margin:0;color:var(--muted)}
.modal-box ul{margin:0;padding-left:18px;color:var(--text)}
.modal-box .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:4px}
.btn.danger-solid{background:var(--red);border-color:var(--red);color:#0B0B0C}
.btn.danger-solid:hover{filter:brightness(1.08)}
/* ---------- drawer / modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;opacity:0;pointer-events:none;transition:opacity .15s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100vw);background:var(--panel);border-left:1px solid var(--line2);z-index:51;transform:translateX(100%);transition:transform .2s ease;display:flex;flex-direction:column}
.drawer.wide{width:min(860px,100vw)}
.drawer.on{transform:none}
.dr-h{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line)}
.dr-b{padding:20px 22px;overflow-y:auto;flex:1}
.dr-f{display:flex;gap:8px;padding:14px 22px;border-top:1px solid var(--line);align-items:center}
.dr-f .sp{flex:1}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form .f{display:flex;flex-direction:column;gap:5px}
.form .f.span{grid-column:1/-1}
.form label{font:500 10.5px/1.2 var(--mono);text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}
.form .sect{grid-column:1/-1;border-top:1px solid var(--line);padding-top:14px;margin-top:4px}
.cl{display:flex;flex-direction:column;gap:6px}
.cl-row{display:flex;align-items:center;gap:8px}
.cl-row .input{padding:6px 8px}
.cl-row.done .input{color:var(--dim);text-decoration:line-through}
.tpl-table{width:100%;border-collapse:collapse}
.tpl-table th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:6px 4px;font-weight:700}
.tpl-table td{padding:3px 4px}
.tpl-table .input{padding:6px 7px;font-size:13px}
.tpl-table select.input{padding-right:22px;background-position:calc(100% - 12px) 52%,calc(100% - 7px) 52%}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:#0a0a0a;padding:10px 16px;border-radius:8px;font-weight:600;z-index:60;opacity:0;transition:.2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1;transform:translateX(-50%)}
.toast.err{background:var(--red);color:#fff}

/* ---------- auth ---------- */
.auth{min-height:100vh;display:grid;place-items:center;padding:20px}
.auth-box{width:min(380px,100%);display:flex;flex-direction:column;gap:14px}
.auth-box .logo{font-size:34px;margin-bottom:6px}
.loading{min-height:100vh;display:grid;place-items:center;color:var(--muted)}

/* ---------- responsive ---------- */
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}.srow{grid-template-columns:100px 1fr;}.srow .hide-sm{display:none}}
@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;padding:6px 8px;border-right:0;border-top:1px solid var(--line);z-index:40;gap:0}
  .side .brand,.side-foot{display:none}
  .nav{flex-direction:row;justify-content:space-around;width:100%}
  .nav a{flex-direction:column;gap:3px;font-size:10px;padding:6px 8px}
  .nav .count{position:absolute;margin:0;transform:translate(10px,-4px)}
  main{padding:18px 16px 90px}
  h1{font-size:28px}.ev-head h1{font-size:30px}
  .phases{grid-template-columns:repeat(2,1fr)}
  .hero{grid-template-columns:1fr}
  .form{grid-template-columns:1fr}
  .countdown{text-align:left}
  .board{grid-template-columns:repeat(5,82vw)}
  .tl-label{width:140px}
}

/* ---------- print (production schedule & task lists) ---------- */
@media print{
  :root{--bg:#fff;--panel:#fff;--panel2:#fff;--text:#000;--muted:#555;--dim:#777;--line:#ccc;--line2:#999;--raise:#eee}
  body{background:#fff}
  .side,.toolbar,.tabs,.back,.demo-bar,.no-print,.drawer,.scrim,.ev-head,.phases,.depts{display:none!important}
  .shell{display:block} main{padding:0}
  .srow{grid-template-columns:110px 110px 1fr 150px 140px;break-inside:avoid}
  .day{break-inside:avoid-page}
  .logo .o{-webkit-text-stroke-color:#000}
  .print-only{display:block!important}
}
.print-only{display:none}

/* ---------- staff app ---------- */
.src{font:600 10px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.av.lg{width:32px;height:32px;font-size:11px}
.fill{font-weight:800;font-size:13px;white-space:nowrap}
.fill.full{color:var(--green)} .fill.short{color:var(--amber)} .fill.none{color:var(--dim)}
.issue{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 7px;border-radius:5px;white-space:nowrap}
.issue.bad{background:rgba(255,112,134,.13);color:var(--red)}
.issue.warn{background:rgba(230,180,80,.13);color:var(--amber)}
.issue.ok{background:rgba(91,201,148,.12);color:var(--green)}
.issue.info{background:var(--raise);color:var(--muted)}
.nowrap{white-space:nowrap}
.var-pos{color:var(--green)} .var-neg{color:var(--red);font-weight:700}
.bar.over i{background:var(--red)}
.bar.ok i{background:var(--green)}

/* overlap check */
.verify{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:start;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--green);border-radius:var(--radius);padding:16px 20px;margin-bottom:22px}
.verify.bad{border-left-color:var(--red)}
.verify .vi{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(91,201,148,.14);color:var(--green)}
.verify.bad .vi{background:rgba(255,112,134,.14);color:var(--red)}
.verify .vi svg{width:20px;height:20px}
.verify .t{display:block;font-size:20px;font-weight:800;font-stretch:84%;text-transform:uppercase;line-height:1.1;margin-top:2px}
.verify ul{margin:8px 0 0;padding-left:18px}
.verify li{margin:4px 0;cursor:pointer}
.verify li:hover{color:var(--orange)}
.vleave{margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}

/* staff list */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font:500 10.5px/1.2 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:8px 8px;border-bottom:1px solid var(--line2);white-space:nowrap}
.tbl td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr.click{cursor:pointer} .tbl tr.click:hover td{background:var(--panel)}
.tbl tr.grp td{padding-top:20px;font-weight:800;text-transform:uppercase;font-stretch:84%;font-size:14px;border-bottom:1px solid var(--line2);background:transparent!important}
.tbl tr.grp td.num{font-stretch:100%;font-size:12px;font-weight:700;text-transform:none}
.tbl tfoot td{font-weight:800;padding-top:14px;border-bottom:0}
.tbl .r{text-align:right}
.tbl .who{display:flex;align-items:center;gap:9px}
.tbl-wrap{overflow-x:auto}
.totals{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.pos-t{font-weight:700;cursor:pointer;font-size:14px}
.pos-t:hover{color:var(--orange)}
.pos-s{font-size:12px;color:var(--muted);margin-top:2px}
.ppl{display:flex;flex-direction:column;gap:5px;align-items:flex-start}
.person{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);background:var(--panel2);border-radius:30px;padding:3px 11px 3px 3px;font-size:12px;font-weight:600;cursor:pointer;max-width:280px;color:var(--text)}
.person:hover{border-color:var(--muted)}
.person .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.person small{color:var(--muted);font-weight:500;white-space:nowrap}
.person .sd{width:7px;height:7px;border-radius:50%;flex:none}
.person .ex{font-weight:900;font-size:12px;line-height:1}
.person.st-confirmed .sd{background:var(--green)}
.person.st-hold .sd{background:var(--amber)}
.person.bad{border-color:var(--red)} .person.bad .ex{color:var(--red)}
.person.warn{border-color:rgba(230,180,80,.55)} .person.warn .ex{color:var(--amber)}
.person.add{border-style:dashed;background:transparent;color:var(--muted);padding:5px 13px}
.person.add:hover{border-color:var(--orange);color:var(--orange)}
.legend .sd{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.preview{margin-top:16px;padding:12px 14px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;font-size:13px;display:flex;flex-direction:column;gap:6px}
.preview .big{font-size:22px;font-weight:800;font-stretch:84%}
.preview.bad{border-color:var(--red)}

/* picker */
.pick-top{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:10px}
.pick-top .f{display:flex;flex-direction:column;gap:5px}
.pick-top label{font:500 10.5px/1.2 var(--mono);text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}
.pick-info{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;margin-bottom:12px;font-size:13px}
.pick{display:grid;grid-template-columns:20px 32px 1fr auto;gap:10px;align-items:center;padding:10px 8px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:6px;user-select:none}
.pick:hover{background:var(--panel2)}
.pick.sel{background:var(--orange-soft)}
.pick.dis{opacity:.5;cursor:not-allowed}
.pick.dis:hover{background:transparent}
.pick .nm{font-weight:700}
.pick .rl{font-size:12px;color:var(--muted)}
.pick .issues{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.pick .rate{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.pick .rate b{display:block;color:var(--text);font-size:13px}
.radio{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center}
.pick.sel .radio{border-color:var(--orange)}
.pick.sel .radio::after{content:'';width:8px;height:8px;border-radius:50%;background:var(--orange)}
.pick-sect{font:500 10.5px/1.2 var(--mono);text-transform:uppercase;letter-spacing:.14em;color:var(--muted);padding:14px 8px 6px}

/* staff database */
.crow{display:grid;grid-template-columns:32px 1fr auto;gap:12px;align-items:center;padding:11px 8px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:6px}
.crow:hover{background:var(--panel)}
.crow .nm{font-weight:700}
.crow .sub{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:3px;font-size:12px;color:var(--muted)}
.crow .right{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--muted);text-align:right}
.crow.off{opacity:.55}
.rows-ed{display:flex;flex-direction:column;gap:6px}
.rows-ed .r4{display:grid;grid-template-columns:140px 140px 1fr 34px;gap:6px}
.rows-ed .input{padding:6px 8px}
.bk{display:grid;grid-template-columns:150px 1fr auto;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line);font-size:13px;align-items:center;cursor:pointer}
.bk:hover{background:var(--panel2)}
.free-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:8px;margin-bottom:16px}
.free-row .input{width:auto}
.free-row.on{border-color:var(--green)}

/* timeline */
.gt-wrap{border:1px solid var(--line);border-radius:var(--radius);overflow:auto;background:var(--panel);max-height:calc(100vh - 230px)}
.gt{min-width:max-content}
.gt-row{display:flex}
.gt-name{position:sticky;left:0;z-index:3;width:220px;flex:none;background:var(--panel);border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:7px 10px;display:flex;gap:9px;align-items:center;cursor:pointer;min-width:0}
.gt-name:hover .n{color:var(--orange)}
.gt-name .n{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gt-name .r{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gt-name > div{min-width:0}
.gt-h{position:sticky;top:0;z-index:4;background:var(--panel)}
.gt-h .gt-name{z-index:5;border-bottom:1px solid var(--line2);cursor:default}
.gt-days{position:relative;flex:none;height:46px;border-bottom:1px solid var(--line2)}
.gt-mo{position:absolute;top:0;height:20px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;padding:3px 6px;border-left:1px solid var(--line2);color:var(--muted);white-space:nowrap}
.gt-d{position:absolute;top:20px;height:26px;font-size:10px;text-align:center;line-height:26px;color:var(--dim)}
.gt-d.we{color:var(--muted)} .gt-d.today{color:var(--orange);font-weight:800}
.gt-track{position:relative;flex:none;border-bottom:1px solid var(--line);height:44px}
.gt-we{position:absolute;top:0;bottom:0;background:rgba(255,255,255,.025)}
.gt-today{position:absolute;top:0;bottom:0;width:2px;background:var(--orange);z-index:2;pointer-events:none;opacity:.8}
.gt-bar{position:absolute;top:9px;height:26px;border-radius:4px;cursor:pointer;display:flex;align-items:center;padding:0 7px;font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;color:#0a0a0a;z-index:1;border:1px solid transparent}
.gt-bar.hold{background:transparent!important;border-style:dashed}
.gt-bar.bad{box-shadow:0 0 0 2px var(--red)}
.gt-away{position:absolute;top:9px;height:26px;border-radius:4px;background:repeating-linear-gradient(135deg,#232327 0 5px,#2d2d32 5px 10px);font-size:10px;color:var(--muted);padding:0 6px;display:flex;align-items:center;overflow:hidden;white-space:nowrap}
.wk{display:flex;align-items:center;gap:6px}

@media (max-width:1100px){.totals{grid-template-columns:repeat(2,1fr)}}
@media (max-width:820px){
  .verify{grid-template-columns:auto 1fr}
  .pick{grid-template-columns:20px 1fr auto}.pick .av{display:none}
  .pick-top{grid-template-columns:1fr 1fr}.pick-top .f:last-child{grid-column:1/-1}
  .rows-ed .r4{grid-template-columns:1fr 1fr 34px}.rows-ed .r4 .nt{grid-column:1/3}
  .hide-sm{display:none}
  .totals{grid-template-columns:repeat(2,1fr)}
  .gt-name{width:130px}.gt-name .av{display:none}
  .ev-actions{justify-content:flex-start}
  .bk{grid-template-columns:1fr auto}.bk .num{grid-column:1/-1}
}
@media print{
  .tbl th,.tbl td{padding:6px 6px}
  .tbl tr{break-inside:avoid}
  .person{border:0;padding:0;background:none}
  .person .sd,.person .ex,.person .av,.btn,.verify{display:none!important}
  .totals{display:none!important}
}

<script>
/* =========================================================================
   Black Canvas · Staff
   Staff assignment for the Black Canvas team portal: the staff database,
   a budgeted staff list for every project (positions with budget rates and
   allowances, and who fills each one for which dates), budget vs actual,
   a timeline of who is where, and an overlap check. The database itself
   refuses any booking that would put someone on two projects on the same day.
   Data lives in Supabase (table staff_records). Projects come from the
   Projects app (read-only, through staff_events()) plus staff-only projects
   added here. Open with ?demo to try it with sample data kept in this browser.
   ========================================================================= */
const CONFIG = {
  TABLE: 'staff_records',
  PORTAL_HOME: '../',
  CURRENCY: 'SAR',
  MONTH_DAYS: 30,   // monthly salaries are charged pro rata: salary × days ÷ 30
  TL_DAYS: 42,      // days shown on the timeline
  DAY_W: 30,        // width of one timeline day, px
};
const DEMO = new URLSearchParams(location.search).has('demo');

/* ---------------- reference lists ---------------- */
const STATUSES = [['pitch','Pitch'],['confirmed','Confirmed'],['preprod','Pre-production'],['build','Build'],['live','Live'],['derig','De-rig'],['wrap','Wrap-up'],['closed','Closed'],['lost','Lost']];
const EVENT_TYPES = ['Concert','Festival','Sports','Corporate','Brand activation','Exhibition','Tour','Ceremony','Other'];
const DEPTS = ['Management','Production','Creative','Technical','Operations','Logistics','Health & Safety','Guest services','Hospitality','Talent & artists','Marketing & content','Finance & admin','Other'];
const TITLES = [
  ['Project director','Management'],['Project manager','Management'],['Account manager','Management'],
  ['Producer','Production'],['Production manager','Production'],['Production coordinator','Production'],['Stage manager','Production'],['Show caller','Production'],['Production assistant','Production'],['Runner','Production'],
  ['Creative director','Creative'],['Designer','Creative'],['3D designer','Creative'],
  ['Technical director','Technical'],['Technical manager','Technical'],['Show control','Technical'],
  ['Site manager','Operations'],['Operations manager','Operations'],['Venue manager','Operations'],['Area supervisor','Operations'],
  ['Logistics coordinator','Logistics'],['Transport coordinator','Logistics'],['Driver','Logistics'],
  ['Health & safety manager','Health & Safety'],['Health & safety officer','Health & Safety'],
  ['Accreditation manager','Guest services'],['Guest relations','Guest services'],['Host / hostess','Guest services'],['Usher','Guest services'],
  ['Hospitality manager','Hospitality'],['VIP host','Hospitality'],
  ['Artist liaison','Talent & artists'],['Talent coordinator','Talent & artists'],
  ['Content producer','Marketing & content'],['Photographer','Marketing & content'],['Videographer','Marketing & content'],['Social media manager','Marketing & content'],
  ['Finance officer','Finance & admin'],['Admin assistant','Finance & admin'],
];
const TITLE_NAMES = TITLES.map(r => r[0]);
const deptOf = t => (TITLES.find(r => r[0].toLowerCase() === String(t || '').toLowerCase()) || [0, ''])[1];
const STAFF_TYPES = [['employee','Employee'],['freelance','Freelancer'],['contract','Contractor'],['agency','Agency']];
const RATE_TYPES = [['day','Per day'],['month','Per month (pro rata)'],['fixed','Fixed fee']];
const RATE_UNIT = { day: '/day', month: '/month', fixed: ' fixed' };
const A_STATUS = [['hold','On hold'],['confirmed','Confirmed'],['released','Released']];
const label = (list, v) => (list.find(x => x[0] === v) || [v, v || '—'])[1];
const PROJ_COLORS = ['#F04E23','#7FA2FF','#5BC994','#E6B450','#B39BFF','#FF7086','#4FC3D9','#D7D6D0'];

/* ---------------- helpers ---------------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { if (!s) return null; const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const today = () => iso(new Date());
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const diff = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
const fmt = (s, o = {weekday:'short', day:'numeric', month:'short'}) => s ? parse(s).toLocaleDateString('en-GB', o) : '';
const fmtShort = s => fmt(s, {day:'numeric', month:'short'});
const fmtDay = s => fmt(s, {day:'numeric', month:'short', year:'numeric'});
function fmtRange(a, b) {
  if (!a) return 'Dates TBC';
  if (!b || a === b) return fmtDay(a);
  const A = parse(a), B = parse(b);
  if (A.getMonth() === B.getMonth() && A.getFullYear() === B.getFullYear()) return `${A.getDate()}–${fmtDay(b)}`;
  if (A.getFullYear() === B.getFullYear()) return `${fmtShort(a)} – ${fmtDay(b)}`;
  return `${fmtDay(a)} – ${fmtDay(b)}`;
}
const plural = (n, w, ws) => `${n} ${n === 1 ? w : (ws || w + 's')}`;
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const num = v => Number(v) || 0;
const money = n => `${CONFIG.CURRENCY} ${Math.round(Number(n) || 0).toLocaleString('en-US')}`;
const daysIn = (a, b) => a && b && b >= a ? diff(a, b) + 1 : 0;
const overlaps = (a, b) => a.from <= b.to && b.from <= a.to;
const waNumber = ph => { let d = String(ph || '').replace(/[^\d]/g, '').replace(/^00/, ''); if (/^05\d{8}$/.test(d)) d = '966' + d.slice(1); return d; };
const waLink = (ph, text) => `https://wa.me/${waNumber(ph)}${text ? '?text=' + encodeURIComponent(text) : ''}`;
const weekStart = s => { const d = parse(s); d.setDate(d.getDate() - d.getDay()); return iso(d); }; // weeks start on Sunday
const isWeekend = s => { const g = parse(s).getDay(); return g === 5 || g === 6; };

/* What a position (budget) or a booking (actual) costs for its dates. */
function costOf(o) {
  const d = daysIn(o.from, o.to), r = num(o.rate), rt = o.rateType || 'day';
  const fee = rt === 'fixed' ? r : rt === 'month' ? r * d / CONFIG.MONTH_DAYS : r * d;
  const perDiem = num(o.perDiem) * d, acc = num(o.accommodation), travel = num(o.travel), other = num(o.other);
  return { days: d, fee, perDiem, acc, travel, other, extras: perDiem + acc + travel + other, total: fee + perDiem + acc + travel + other };
}
const rateHTML = (rt, r) => num(r) ? `${money(r)}<span class="dim">${RATE_UNIT[rt || 'day']}</span>` : '<span class="dim">No rate</span>';
const varHTML = v => v < -0.5 ? `<span class="var-neg">−${money(-v)}</span>` : v > 0.5 ? `<span class="var-pos">${money(v)}</span>` : '<span class="dim">—</span>';

const ICON = {
  grid:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>',
  bars:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 4v16h18"/><path d="M7 8h7M10 12h8M7 16h5"/></svg>',
  users:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="4"/><path d="M1 21v-1a7 7 0 0114 0v1"/><path d="M17 4a4 4 0 010 8M23 21v-1a7 7 0 00-4-6.3"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>',
  left:'<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>',
  right:'<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>',
  x:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/></svg>',
  print:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V2h12v7M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>',
  copy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="1"/><path d="M5 15H4a1 1 0 01-1-1V4a1 1 0 011-1h10a1 1 0 011 1v1"/></svg>',
  dl:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></svg>',
  chat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a8 8 0 01-11.6 7.1L4 20l1-5A8 8 0 1121 12z"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  alert:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 7v6M12 17h.01"/><circle cx="12" cy="12" r="10"/></svg>',
  coin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="13" rx="1"/><circle cx="12" cy="12.5" r="3"/><path d="M6 9.5v6M18 9.5v6"/></svg>',
};

/* =========================================================================
   Data layer: same interface for Supabase and demo mode
   ========================================================================= */
const COLLS = ['staff','projects','positions','assign','budgets','settings'];
const db = Object.fromEntries(COLLS.map(c => [c, new Map()]));
const pmEvents = new Map();          // projects from the Projects app (read-only here)
let sb = null, me = null, myName = '';

const Backend = {
  async load() {
    COLLS.forEach(c => db[c].clear()); pmEvents.clear();
    if (DEMO) {
      const store = lsGet('bc-staff-demo', null) || seedDemo();
      for (const c of COLLS) for (const [id, data] of Object.entries(store[c] || {})) db[c].set(id, data);
      for (const [id, data] of Object.entries(store.pm || {})) pmEvents.set(id, data);
      return;
    }
    let from = 0;
    for (;;) {
      const { data, error } = await sb.from(CONFIG.TABLE).select('coll,id,data').order('coll').order('id').range(from, from + 999);
      if (error) throw error;
      data.forEach(r => db[r.coll]?.set(r.id, r.data));
      if (data.length < 1000) break;
      from += 1000;
    }
    await this.loadEvents();
  },
  async loadEvents() {
    if (DEMO) return;
    const { data, error } = await sb.rpc('staff_events');
    if (error) { console.warn('Projects events unavailable', error); return; }
    pmEvents.clear();
    (data || []).forEach(r => pmEvents.set(r.id, { ...r.data, id: r.id }));
  },
  saveDemo() {
    const store = { pm: Object.fromEntries(pmEvents) };
    for (const c of COLLS) store[c] = Object.fromEntries(db[c]);
    lsSet('bc-staff-demo', store);
  },
  async put(coll, id, data) { return this.putMany([{ coll, id, data }]); },
  async putMany(rows) {
    if (DEMO) { demoGuard(rows); rows.forEach(r => db[r.coll].set(r.id, r.data)); return this.saveDemo(); }
    for (let i = 0; i < rows.length; i += 200) {
      const { error } = await sb.from(CONFIG.TABLE).upsert(rows.slice(i, i + 200));
      if (error) throw error;
    }
    rows.forEach(r => db[r.coll].set(r.id, r.data));
  },
  async delMany(coll, ids) {
    if (!ids.length) return;
    ids.forEach(id => db[coll].delete(id));
    if (DEMO) return this.saveDemo();
    for (let i = 0; i < ids.length; i += 100) {
      const { error } = await sb.from(CONFIG.TABLE).delete().eq('coll', coll).in('id', ids.slice(i, i + 100));
      if (error) throw error;
    }
  },
  subscribe() {
    if (DEMO) return;
    sb.channel('staff-live')
      .on('postgres_changes', { event: '*', schema: 'public', table: CONFIG.TABLE }, p => {
        if (p.eventType === 'DELETE') { const o = p.old || {}; o.coll && db[o.coll]?.delete(o.id); }
        else { const n = p.new; n?.coll && db[n.coll]?.set(n.id, n.data); }
        scheduleRender();
      })
      .subscribe();
    document.addEventListener('visibilitychange', () => { if (!document.hidden) this.loadEvents().then(scheduleRender); });
  },
};

/* Demo mode has no database, so it applies the database's overlap rule here. */
function overlapMsg(a, b) {
  return `${db.staff.get(a.staffId)?.name || 'This person'} is already on ${getProject(b.projectId)?.name || 'another project'} from ${fmtDay(b.from)} to ${fmtDay(b.to)}${(b.status || 'hold') === 'hold' ? ' (on hold)' : ''}. Someone can’t be on two projects at the same time.`;
}
function demoGuard(rows) {
  const asg = new Map(db.assign), err = m => Object.assign(new Error(m), { code: 'P0001' });
  for (const r of rows) {
    if (r.coll !== 'assign') continue;
    const a = r.data;
    if (!a.staffId) throw err('Pick a staff member for this booking.');
    if (!a.from || !a.to) throw err('Set a start and end date.');
    if (a.to < a.from) throw err('The end date is before the start date.');
    if (live(a)) for (const b of asg.values()) if (b.id !== a.id && b.staffId === a.staffId && live(b) && overlaps(a, b)) throw err(overlapMsg(a, b));
    asg.set(a.id, a);
  }
}

async function save(coll, id, data, msg) {
  try { await Backend.put(coll, id, data); render(); if (msg) toast(msg); return true; }
  catch (e) { failed(e); return false; }
}
async function failed(e) {
  console.error(e);
  if (!DEMO && /jwt/i.test(e?.message || '')) { toast('Your sign-in has expired. Taking you to sign in…', true); return setTimeout(() => leave('?next=staff'), 1600); }
  if (e?.code === 'P0001') await confirmDialog({ title: 'Can’t save that', body: `<p>${esc(e.message)}</p>`, ok: 'OK', cancel: false });
  else toast(BCPortal.saveError(e) || 'Couldn’t save — ' + (e?.message || 'check your connection'), true);
  try { await Backend.load(); render(); } catch {}
}

/* ---------------- projects ---------------- */
const getProject = id => pmEvents.get(id) || db.projects.get(id) || null;
const isPm = id => pmEvents.has(id);
const allProjects = () => [...pmEvents.values(), ...db.projects.values()];
const projName = id => getProject(id)?.name || 'Removed project';
function anchorsOf(p) {
  const d = p?.dates || {};
  const show = d.showStart || null;
  return { show, build: d.buildStart || show, showEnd: d.showEnd || show, derig: d.derigEnd || d.showEnd || show };
}
function windowOf(p) { const a = anchorsOf(p); return { from: a.build || a.show || '', to: a.derig || a.showEnd || a.show || '' }; }
function isPast(p) {
  if (['closed','lost'].includes(p.status)) return true;
  const end = [windowOf(p).to, ...(idx().byProject.get(p.id) || []).map(x => x.to)].filter(Boolean).sort().pop();
  return !!end && end < today();
}
function projColor(id) {
  const ids = allProjects().map(p => p.id).sort();
  return PROJ_COLORS[Math.max(0, ids.indexOf(id)) % PROJ_COLORS.length];
}

const firstName = id => staffName(id).split(/\s+/)[0];
const initials = id => staffName(id).split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
const avatar = (id, lg) => `<span class="av ${lg ? 'lg' : ''}" title="${esc(staffName(id))}">${esc(initials(id))}</span>`;
const staffTitles = s => [s.title, ...(s.skills || [])].filter(Boolean).map(r => r.toLowerCase());
const sortStaff = (a, b) => (a.name || '').localeCompare(b.name || '');

/* =========================================================================
   Derived index, rebuilt once per render
   ========================================================================= */
let IDX = null;
const live = a => (a.status || 'hold') !== 'released';
const deptRank = d => { const i = DEPTS.indexOf(d); return i < 0 ? 99 : i; };
const titleRank = t => { const i = TITLE_NAMES.findIndex(x => x.toLowerCase() === String(t || '').toLowerCase()); return i < 0 ? 999 : i; };
const sortPositions = (a, b) => deptRank(a.dept) - deptRank(b.dept) || (a.dept || '').localeCompare(b.dept || '') || titleRank(a.title) - titleRank(b.title)
  || (a.title || '').localeCompare(b.title || '') || (a.from || '').localeCompare(b.from || '') || (a.createdAt || '').localeCompare(b.createdAt || '') || (a.n || 0) - (b.n || 0);
function idx() {
  if (IDX) return IDX;
  const byProject = new Map(), byPos = new Map(), byStaff = new Map(), asgByProject = new Map(), issues = new Map();
  const push = (m, k, v) => { let l = m.get(k); if (!l) m.set(k, l = []); l.push(v); };
  for (const p of db.positions.values()) push(byProject, p.projectId, p);
  for (const a of db.assign.values()) {
    push(byPos, a.positionId, a); push(asgByProject, a.projectId, a);
    if (live(a)) push(byStaff, a.staffId, a);
  }
  byStaff.forEach(l => l.sort((x, y) => (x.from || '').localeCompare(y.from || '')));
  byPos.forEach(l => l.sort((x, y) => (x.from || '').localeCompare(y.from || '')));
  byProject.forEach(l => l.sort(sortPositions));
  IDX = { byProject, byPos, byStaff, asgByProject, issues };
  return IDX;
}
const posAssigns = pid => idx().byPos.get(pid) || [];

function clashesFor(staffId, from, to, ignoreId) {
  if (!staffId || !from || !to) return [];
  return (idx().byStaff.get(staffId) || []).filter(b => b.id !== ignoreId && b.from <= to && from <= b.to);
}
function leaveFor(staffId, from, to) {
  if (!from || !to) return [];
  return (db.staff.get(staffId)?.away || []).filter(w => w.from && w.from <= to && from <= (w.to || w.from));
}
function issuesFor(staffId, from, to, ignoreId) {
  const out = [];
  for (const b of clashesFor(staffId, from, to, ignoreId)) out.push({ lvl: 'bad', t: `Busy: ${projName(b.projectId)} · ${fmtShort(b.from)}–${fmtShort(b.to)}${b.status === 'hold' ? ' (hold)' : ''}`, a: b });
  for (const w of leaveFor(staffId, from, to)) out.push({ lvl: 'warn', t: `On leave ${fmtShort(w.from)}–${fmtShort(w.to || w.from)}${w.note ? ' · ' + w.note : ''}` });
  const s = db.staff.get(staffId);
  if (s && s.active === false) out.push({ lvl: 'warn', t: 'Marked inactive' });
  return out;
}
function asgIssues(a) {
  const I = idx().issues;
  if (!I.has(a.id)) I.set(a.id, live(a) ? issuesFor(a.staffId, a.from, a.to, a.id) : []);
  return I.get(a.id);
}
const worst = list => list.some(i => i.lvl === 'bad') ? 'bad' : list.length ? 'warn' : '';
const issueTags = list => list.map(i => `<span class="issue ${i.lvl}">${esc(i.t)}</span>`).join('');

/* Which days of a position are covered by someone, and the gaps. */
function coverage(pos) {
  const as = posAssigns(pos.id).filter(live), d = daysIn(pos.from, pos.to), covered = new Set(), gaps = [];
  if (d) {
    for (const a of as) for (let x = a.from < pos.from ? pos.from : a.from; x <= a.to && x <= pos.to; x = addDays(x, 1)) covered.add(x);
    let g = null;
    for (let x = pos.from; x <= pos.to; x = addDays(x, 1)) {
      if (!covered.has(x)) { if (g) g.to = x; else g = { from: x, to: x }; }
      else if (g) { gaps.push(g); g = null; }
    }
    if (g) gaps.push(g);
  }
  return { days: d, covered: covered.size, gaps, as };
}
function posState(pos, cv = coverage(pos)) {
  if (!cv.as.length) return ['open', 'Open', 'warn'];
  if (cv.gaps.length) return ['gap', `${plural(cv.days - cv.covered, 'day')} uncovered`, 'warn'];
  if (cv.as.every(a => a.status === 'confirmed')) return ['confirmed', 'Confirmed', 'ok'];
  return ['hold', 'On hold', 'warn'];
}

function projStats(pid) {
  const st = { positions: 0, filled: 0, open: 0, gaps: 0, people: new Set(), lines: 0, actual: 0, confirmed: 0, hold: 0, bad: 0, warn: 0 };
  for (const p of idx().byProject.get(pid) || []) {
    st.positions++; st.lines += costOf(p).total;
    const cv = coverage(p);
    if (!cv.as.length) st.open++; else { st.filled++; if (cv.gaps.length) st.gaps++; }
  }
  for (const a of idx().asgByProject.get(pid) || []) {
    if (!live(a)) continue;
    const c = costOf(a).total;
    st.actual += c; st[a.status === 'confirmed' ? 'confirmed' : 'hold'] += c; st.people.add(a.staffId);
    const w = worst(asgIssues(a)); if (w) st[w]++;
  }
  st.cap = num(db.budgets.get(pid)?.cap);
  st.budget = st.cap || st.lines;
  st.remaining = st.budget - st.actual;
  st.pct = st.positions ? Math.round(st.filled / st.positions * 100) : 0;
  return st;
}

/* Every live booking checked against every other one for the same person. */
function overlapCheck() {
  const pairs = [], leave = [], t = today();
  let n = 0;
  for (const [sid, list] of idx().byStaff) {
    n += list.length;
    for (let i = 0; i < list.length; i++) for (let j = i + 1; j < list.length && list[j].from <= list[i].to; j++) pairs.push([list[i], list[j]]);
    for (const a of list) if (a.to >= t) { const w = leaveFor(sid, a.from, a.to)[0]; if (w) leave.push({ a, w }); }
  }
  return { n, people: idx().byStaff.size, pairs, leave };
}

/* Positions starting in the next 30 days with no one (or not everyone) on them. */
function openSoon() {
  const t = today(), end = addDays(t, 30); let n = 0;
  for (const p of db.positions.values()) {
    if (!p.from || p.to < t || p.from > end || !getProject(p.projectId)) continue;
    if (coverage(p).gaps.length) n++;
  }
  return n;
}

function filteredProjects() {
  const q = ui.q.trim().toLowerCase();
  return allProjects().filter(p => {
    const past = isPast(p);
    if (ui.filter === 'upcoming' && past) return false;
    if (ui.filter === 'past' && !past) return false;
    if (q && ![p.name, p.client, p.venue, p.city, p.code].join(' ').toLowerCase().includes(q)) return false;
    return true;
  }).sort((a, b) => {
    const A = windowOf(a).from || '9999', B = windowOf(b).from || '9999';
    return ui.filter === 'past' ? B.localeCompare(A) : A.localeCompare(B);
  });
}
function verifyPanel() {
  const c = overlapCheck(), ok = !c.pairs.length;
  const at = new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
  const head = ok
    ? `<span class="eyebrow">Overlap check</span><b class="t">No overlaps</b><div class="muted" style="margin-top:4px">${c.n ? `${plural(c.n, 'booking')} for ${plural(c.people, 'person', 'people')} checked — no one is on two projects on the same day.` : 'Nothing booked yet.'} The database refuses any booking that would double-book someone.</div>`
    : `<span class="eyebrow" style="color:var(--red)">Overlap check</span><b class="t" style="color:var(--red)">${plural(c.pairs.length, 'overlap')} found</b><ul>${c.pairs.map(([a, b]) => `<li data-act="asg" data-id="${esc(a.id)}"><b>${esc(staffName(a.staffId))}</b> — ${esc(projName(a.projectId))} (${esc(fmtShort(a.from))}–${esc(fmtShort(a.to))}) and ${esc(projName(b.projectId))} (${esc(fmtShort(b.from))}–${esc(fmtShort(b.to))})</li>`).join('')}</ul>`;
  const lv = c.leave.length ? `<div class="vleave"><span class="eyebrow" style="color:var(--amber)">Booked during leave · ${c.leave.length}</span><ul>${c.leave.map(({ a, w }) => `<li data-act="asg" data-id="${esc(a.id)}"><b>${esc(staffName(a.staffId))}</b> — ${esc(projName(a.projectId))} (${esc(fmtShort(a.from))}–${esc(fmtShort(a.to))}), on leave ${esc(fmtShort(w.from))}–${esc(fmtShort(w.to || w.from))}${w.note ? ` · ${esc(w.note)}` : ''}</li>`).join('')}</ul></div>` : '';

}
function viewProjects() {

    ${[['list', 'Staff list', s.positions], ['budget', 'Budget', null]].map(([k, l, n]) => `<a href="#/project/${encodeURIComponent(p.id)}/${k}" class="${tab === k ? 'on' : ''}">${l}${n != null ? `<span class="n num">${n}</span>` : ''}</a>`).join('')}
  </div>
  ${tab === 'budget' ? tabBudget(p) : tabList(p)}`;
}

/* ---- Staff list tab ---- */
function printHead(p, what) {
  const w = windowOf(p);
  return `<div class="print-only"><div class="logo-svg" style="width:180px;color:#000">${BCPortal.logoSvg('line', '#000')}</div><h2 style="margin-top:12px">${esc(p.name)} — ${esc(what)}</h2><div class="muted">${esc([p.client, p.venue, p.city].filter(Boolean).join(' · '))}${p.code ? ' · ' + esc(p.code) : ''} · ${esc(fmtRange(w.from, w.to))} · printed ${esc(fmtDay(today()))}</div><br></div>`;
}
function tabList(p) {
  const list = idx().byProject.get(p.id) || [];
  const head = `<div class="toolbar no-print">
    <button class="btn primary" data-act="newPos" data-id="${esc(p.id)}">${ICON.plus} Add positions</button>
    <button class="btn" data-act="copyFrom" data-id="${esc(p.id)}">${ICON.copy} Copy from a project</button>
    <div class="grow"></div>
    <div class="legend"><span><i class="sd" style="background:var(--green)"></i>Confirmed</span><span><i class="sd" style="background:var(--amber)"></i>On hold</span></div>
    <button class="btn" data-act="csv" data-id="${esc(p.id)}">${ICON.dl} CSV</button>
    <button class="btn ghost" data-act="print" title="Print">${ICON.print}</button>
  </div>`;
  if (!list.length) return head + `<div class="empty"><b>No staff list yet</b>Add the positions this project needs — e.g. 1 project manager, 2 production coordinators, 4 hosts — with dates and a budget rate, then assign people from your staff.<br><br><button class="btn primary" data-act="newPos" data-id="${esc(p.id)}">${ICON.plus} Add positions</button> <button class="btn" data-act="copyFrom" data-id="${esc(p.id)}">${ICON.copy} Copy from a project</button></div>`;
  const groups = new Map();
  for (const ps of list) { const k = ps.dept || 'Other'; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(ps); }
  let body = '', tb = 0, ta = 0, tAny = false;
  for (const [dept, ps] of groups) {
    let gb = 0, ga = 0;
    const rows = ps.map(x => { const r = posRow(x); gb += r.b; ga += r.a; tAny ||= r.any; return r.html; }).join('');
    tb += gb; ta += ga;
    body += `<tr class="grp"><td colspan="5">${esc(dept)} <span class="muted" style="font-weight:600;font-size:12px;font-stretch:100%;text-transform:none">· ${plural(ps.length, 'position')}</span></td><td class="r num">${money(gb)}</td><td class="r num">${money(ga)}</td><td class="r num">${varHTML(gb - ga)}</td></tr>${rows}`;
  }
  return head + printHead(p, 'staff list') + `<div class="tbl-wrap"><table class="tbl">
    <thead><tr><th>Position</th><th>Staff</th><th>Dates</th><th class="r">Days</th><th>Status</th><th class="r">Budget</th><th class="r">Booked</th><th class="r" title="Budget minus booked. Positive is under budget.">Variance</th></tr></thead>
    <tbody>${body}</tbody>
    <tfoot><tr><td colspan="5">Total · ${plural(list.length, 'position')}</td><td class="r num">${money(tb)}</td><td class="r num">${money(ta)}</td><td class="r num">${varHTML(tb - ta)}</td></tr></tfoot>
  </table></div>
  <p class="dim" style="font-size:12px;margin-top:12px">Budget is each position’s budget rate and allowances for its dates. Booked is each person’s own rate and allowances for the dates they’re assigned. Monthly salaries count pro rata (salary × days ÷ ${CONFIG.MONTH_DAYS}).</p>`;
}
function posRow(ps) {
  const cv = coverage(ps), b = costOf(ps).total, act = cv.as.reduce((n, a) => n + costOf(a).total, 0);
  const [, stLabel, stCls] = posState(ps, cv);
  const people = cv.as.map(a => {
    const iss = asgIssues(a), w = worst(iss), other = a.from !== ps.from || a.to !== ps.to;
    return `<button class="person st-${esc(a.status || 'hold')} ${w}" data-act="asg" data-id="${esc(a.id)}" title="${esc(label(A_STATUS, a.status || 'hold'))}${iss.length ? ' · ' + iss.map(i => i.t).join(' · ') : ''}">${avatar(a.staffId)}<span class="nm">${esc(staffName(a.staffId))}</span>${other ? `<small class="num">${esc(fmtShort(a.from))}–${esc(fmtShort(a.to))}</small>` : ''}${w ? '<span class="ex">!</span>' : ''}<span class="sd"></span></button>`;
  }).join('');
  const add = !cv.as.length ? `<button class="person add no-print" data-act="pick" data-id="${esc(ps.id)}">+ Assign</button>`
    : cv.gaps.length ? `<button class="person add no-print" data-act="pick" data-id="${esc(ps.id)}">+ Cover ${plural(cv.days - cv.covered, 'day')}</button>` : '';
  return { b, a: act, any: !!cv.as.length, html: `<tr>
    <td><div class="pos-t" data-act="pos" data-id="${esc(ps.id)}" role="button" tabindex="0">${esc(ps.title || 'Position')}</div><div class="pos-s">${rateHTML(ps.rateType, ps.rate)}${ps.note ? ` · ${esc(ps.note)}` : ''}</div></td>
    <td><div class="ppl">${people}${add}</div></td>
    <td class="num nowrap">${esc(fmtRange(ps.from, ps.to))}</td>
    <td class="r num">${cv.days}</td>
    <td><span class="issue ${stCls}">${esc(stLabel)}</span></td>
    <td class="r num">${money(b)}</td>
    <td class="r num">${cv.as.length ? money(act) : '<span class="dim">—</span>'}</td>
    <td class="r num">${cv.as.length ? varHTML(b - act) : ''}</td>
  </tr>` };
}

/* ---- Budget tab ---- */
function tabBudget(p) {
  const s = projStats(p.id), list = idx().byProject.get(p.id) || [], asg = (idx().asgByProject.get(p.id) || []).filter(live);
  const bud = db.budgets.get(p.id) || {};
  const byDept = new Map();
  const row = k => { if (!byDept.has(k)) byDept.set(k, { pos: 0, people: new Set(), days: 0, b: 0, a: 0 }); return byDept.get(k); };
  for (const ps of list) { const r = row(ps.dept || 'Other'); r.pos++; r.b += costOf(ps).total; }
  for (const a of asg) { const ps = db.positions.get(a.positionId), r = row(ps?.dept || 'Other'); r.people.add(a.staffId); r.days += daysIn(a.from, a.to); r.a += costOf(a).total; }
  const depts = [...byDept.entries()].sort((x, y) => deptRank(x[0]) - deptRank(y[0]));
  const sum = (arr, k) => arr.reduce((n, o) => n + costOf(o)[k], 0);
  const kinds = [['Fees and salaries', 'fee'], ['Per diems', 'perDiem'], ['Accommodation', 'acc'], ['Travel', 'travel'], ['Other', 'other']];
  const over = s.remaining < -0.5, planVsCap = s.cap ? s.lines - s.cap : 0;
  return `<div class="toolbar no-print"><button class="btn primary" data-act="budget" data-id="${esc(p.id)}">${ICON.coin} ${s.cap ? 'Change' : 'Set'} overall budget</button><div class="grow"></div><button class="btn" data-act="csv" data-id="${esc(p.id)}">${ICON.dl} CSV</button><button class="btn ghost" data-act="print" title="Print">${ICON.print}</button></div>
  ${printHead(p, 'staff budget')}
  <div class="totals">
    <div class="kpi"><div class="eyebrow">Staff budget</div><div class="v num" style="font-size:24px">${money(s.budget)}</div><div class="dim" style="font-size:12px;margin-top:6px">${s.cap ? 'Overall budget you set' : 'Total of the positions'}</div></div>
    <div class="kpi"><div class="eyebrow">Confirmed</div><div class="v num" style="font-size:24px">${money(s.confirmed)}</div></div>
    <div class="kpi"><div class="eyebrow">On hold</div><div class="v num" style="font-size:24px;${s.hold ? 'color:var(--amber)' : ''}">${money(s.hold)}</div></div>
    <div class="kpi ${over ? 'alert' : ''}"><div class="eyebrow">${over ? 'Over budget' : 'Remaining'}</div><div class="v num" style="font-size:24px;${over ? '' : 'color:var(--green)'}">${money(Math.abs(s.remaining))}</div></div>
  </div>
  ${s.cap ? `<div class="pick-info"><span>Positions add up to <b class="num">${money(s.lines)}</b> against the overall budget of <b class="num">${money(s.cap)}</b>${bud.note ? ` · <span class="muted">${esc(bud.note)}</span>` : ''}</span>${planVsCap > 0.5 ? `<span class="issue bad">Plan is ${money(planVsCap)} over</span>` : `<span class="issue ok">Plan fits · ${money(-planVsCap)} spare</span>`}</div>` : ''}
  <h2 style="margin:8px 0 10px">By department</h2>
  ${depts.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Department</th><th class="r">Positions</th><th class="r">People</th><th class="r hide-sm">Person-days</th><th class="r">Budget</th><th class="r">Booked</th><th class="r">Variance</th></tr></thead>
    <tbody>${depts.map(([d, r]) => `<tr><td><b>${esc(d)}</b></td><td class="r num">${r.pos}</td><td class="r num">${r.people.size}</td><td class="r num hide-sm">${r.days}</td><td class="r num">${money(r.b)}</td><td class="r num">${money(r.a)}</td><td class="r num">${varHTML(r.b - r.a)}</td></tr>`).join('')}</tbody>
    <tfoot><tr><td>Total</td><td class="r num">${list.length}</td><td class="r num">${s.people.size}</td><td class="r num hide-sm">${asg.reduce((n, a) => n + daysIn(a.from, a.to), 0)}</td><td class="r num">${money(s.lines)}</td><td class="r num">${money(s.actual)}</td><td class="r num">${varHTML(s.lines - s.actual)}</td></tr></tfoot></table></div>`
    : '<div class="empty"><b>Nothing budgeted yet</b>Add positions on the Staff list tab to build the budget.</div>'}
  <h2 style="margin:28px 0 10px">By cost type</h2>
  <div class="tbl-wrap" style="max-width:640px"><table class="tbl"><thead><tr><th>Cost</th><th class="r">Budget</th><th class="r">Booked</th><th class="r">Variance</th></tr></thead>
    <tbody>${kinds.map(([l, k]) => { const b = sum(list, k), a = sum(asg, k); return `<tr><td>${l}</td><td class="r num">${money(b)}</td><td class="r num">${money(a)}</td><td class="r num">${varHTML(b - a)}</td></tr>`; }).join('')}</tbody></table></div>
  <p class="dim" style="font-size:12px;margin-top:12px">Booked counts confirmed and on-hold bookings; released bookings aren’t counted. Monthly salaries count pro rata (salary × days ÷ ${CONFIG.MONTH_DAYS}).</p>`;
}

/* =========================================================================
   View: Timeline (who is where)
   ========================================================================= */
function viewTimeline() {
  const t = today(), N = CONFIG.TL_DAYS, W = CONFIG.DAY_W;
  const start = ui.tlStart || addDays(weekStart(t), -7), end = addDays(start, N - 1);
  const q = ui.tlQ.trim().toLowerCase();
  const inRange = id => (idx().byStaff.get(id) || []).filter(a => a.from <= end && a.to >= start && (!ui.tlProject || a.projectId === ui.tlProject));
  const staff = [...db.staff.values()].filter(s => s.active !== false || inRange(s.id).length)
    .filter(s => !ui.tlDept || (s.dept || deptOf(s.title)) === ui.tlDept)
    .filter(s => !q || [s.name, s.title, s.city].join(' ').toLowerCase().includes(q))
    .filter(s => !(ui.tlBooked || ui.tlProject) || inRange(s.id).length)
    .sort((a, b) => deptRank(a.dept || deptOf(a.title)) - deptRank(b.dept || deptOf(b.title)) || titleRank(a.title) - titleRank(b.title) || sortStaff(a, b));
  const projs = allProjects().filter(p => (idx().asgByProject.get(p.id) || []).some(a => live(a) && a.from <= end && a.to >= start)).sort((a, b) => (windowOf(a).from || '').localeCompare(windowOf(b).from || ''));
  const head = `<div class="page-head"><div><div class="eyebrow">${esc(fmtShort(start))} – ${esc(fmtDay(end))}</div><h1>Timeline</h1></div>
    <div class="wk"><button class="btn sm" data-act="tlMove" data-v="-14" aria-label="Earlier">${ICON.left}</button><button class="btn sm" data-act="tlToday">Today</button><button class="btn sm" data-act="tlMove" data-v="14" aria-label="Later">${ICON.right}</button></div></div>
  <div class="toolbar">
    <input class="input" id="tlSearch" style="max-width:220px" placeholder="Search staff…" value="${esc(ui.tlQ)}" data-inp="tlQ">
    <select class="input" style="width:auto" data-chg="tlDept"><option value="">All departments</option>${DEPTS.map(d => `<option ${ui.tlDept === d ? 'selected' : ''}>${esc(d)}</option>`).join('')}</select>
    <select class="input" style="width:auto;max-width:240px" data-chg="tlProject"><option value="">All projects</option>${projs.map(p => `<option value="${esc(p.id)}" ${ui.tlProject === p.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select>
    <label class="check"><input type="checkbox" data-chg="tlBooked" ${ui.tlBooked ? 'checked' : ''}> Only people with bookings</label>
    <div class="grow"></div><span class="muted">${plural(staff.length, 'person', 'people')}</span>
  </div>`;
  if (!db.staff.size) return head + `<div class="empty"><b>No staff yet</b>Add your staff on the Staff page to see who’s on which project.<br><br><a class="btn primary" href="#/staff">${ICON.users} Go to Staff</a></div>`;
  const days = Array.from({ length: N }, (_, i) => addDays(start, i)), width = N * W;
  let months = '';
  days.forEach((d, i) => { if (i === 0 || d.endsWith('-01')) months += `<div class="gt-mo" style="left:${i * W}px">${esc(fmt(d, { month: 'long', year: 'numeric' }))}</div>`; });
  const dayHead = days.map((d, i) => `<div class="gt-d ${isWeekend(d) ? 'we' : ''} ${d === t ? 'today' : ''}" style="left:${i * W}px;width:${W}px">${parse(d).getDate()}</div>`).join('');
  const shade = days.map((d, i) => isWeekend(d) ? `<div class="gt-we" style="left:${i * W}px;width:${W}px"></div>` : '').join('');
  const todayLine = t >= start && t <= end ? `<div class="gt-today" style="left:${diff(start, t) * W + W / 2}px"></div>` : '';
  const seg = (from, to) => { const a = Math.max(0, diff(start, from)), b = Math.min(N - 1, diff(start, to)); return b < a ? null : { left: a * W + 1, w: (b - a + 1) * W - 3 }; };
  const seen = new Set();
  const rows = staff.map(s => {
    const away = (s.away || []).filter(w => w.from && w.from <= end && (w.to || w.from) >= start).map(w => { const g = seg(w.from, w.to || w.from); return g ? `<div class="gt-away" style="left:${g.left}px;width:${g.w}px" title="${esc(w.note || 'On leave')}">${esc(w.note || 'Leave')}</div>` : ''; }).join('');
    const bars = inRange(s.id).map(a => {
      const g = seg(a.from, a.to); if (!g) return '';
      const p = getProject(a.projectId), col = projColor(a.projectId), hold = a.status !== 'confirmed', bad = worst(asgIssues(a)) === 'bad';
      seen.add(a.projectId);
      return `<div class="gt-bar ${hold ? 'hold' : ''} ${bad ? 'bad' : ''}" style="left:${g.left}px;width:${g.w}px;background:${col};${hold ? `color:${col};border-color:${col}` : ''}" data-act="asg" data-id="${esc(a.id)}" title="${esc(projName(a.projectId))} · ${esc(a.title || '')} · ${esc(fmtShort(a.from))}–${esc(fmtShort(a.to))} · ${esc(label(A_STATUS, a.status || 'hold'))}">${esc(p?.code || projName(a.projectId))}${a.title ? ` · ${esc(a.title)}` : ''}</div>`;
    }).join('');
    return `<div class="gt-row"><div class="gt-name" data-act="staff" data-id="${esc(s.id)}">${avatar(s.id)}<div><div class="n">${esc(s.name)}</div><div class="r">${esc(s.title || '—')}</div></div></div><div class="gt-track" style="width:${width}px">${shade}${todayLine}${away}${bars}</div></div>`;
  }).join('');
  return head + `<div class="gt-wrap"><div class="gt"><div class="gt-row gt-h"><div class="gt-name"><span class="eyebrow">Staff</span></div><div class="gt-days" style="width:${width}px">${months}${dayHead}</div></div>${rows || `<div class="empty" style="margin:16px">${ui.tlBooked ? 'No one is booked in these weeks. Untick “Only people with bookings” to see everyone.' : 'No staff match these filters.'}</div>`}</div></div>
  <div class="legend" style="margin-top:12px">${[...seen].map(id => `<span><i style="background:${projColor(id)}"></i>${esc(projName(id))}</span>`).join('')}<span><i style="border:1px dashed var(--muted)"></i>On hold</span><span><i style="background:repeating-linear-gradient(135deg,#232327 0 3px,#3a3a40 3px 6px)"></i>Leave</span></div>`;
}

/* =========================================================================
   View: Staff database
   ========================================================================= */
function viewStaff() {
  const t = today(), q = ui.sQ.trim().toLowerCase();
  const all = [...db.staff.values()];
  const freeOn = ui.freeFrom && ui.freeTo && ui.freeTo >= ui.freeFrom;
  const list = all.filter(s => ui.showInactive || s.active !== false)
    .filter(s => !ui.sType || (s.type || 'employee') === ui.sType)
    .filter(s => !ui.sDept || (s.dept || deptOf(s.title)) === ui.sDept)
    .filter(s => !q || [s.name, s.title, s.city, s.phone, s.email, s.agency, ...(s.skills || [])].join(' ').toLowerCase().includes(q))
    .filter(s => !freeOn || (!clashesFor(s.id, ui.freeFrom, ui.freeTo).length && !leaveFor(s.id, ui.freeFrom, ui.freeTo).length))
    .sort((a, b) => (a.active === false) - (b.active === false) || deptRank(a.dept || deptOf(a.title)) - deptRank(b.dept || deptOf(b.title)) || titleRank(a.title) - titleRank(b.title) || sortStaff(a, b));
  const counts = { '': all.filter(s => ui.showInactive || s.active !== false).length };
  STAFF_TYPES.forEach(([k]) => counts[k] = all.filter(s => (ui.showInactive || s.active !== false) && (s.type || 'employee') === k).length);
  return `<div class="page-head"><div><div class="eyebrow">Database</div><h1>Staff</h1></div>
    <div style="display:flex;gap:8px"><button class="btn" data-act="importStaff">Import list</button><button class="btn primary" data-act="newStaff">${ICON.plus} Add staff</button></div></div>
  <div class="toolbar">
    <div class="chips">${[['', 'All'], ...STAFF_TYPES].map(([k, l]) => `<button class="chip ${ui.sType === k ? 'on' : ''}" data-act="sType" data-v="${k}">${l} <span class="num">${counts[k]}</span></button>`).join('')}</div>
    <select class="input" style="width:auto" data-chg="sDept"><option value="">All departments</option>${DEPTS.map(d => `<option ${ui.sDept === d ? 'selected' : ''}>${esc(d)}</option>`).join('')}</select>
    <label class="check"><input type="checkbox" data-chg="showInactive" ${ui.showInactive ? 'checked' : ''}> Show inactive</label>
    <div class="grow"></div>
    <input class="input" id="sSearch" style="max-width:240px" placeholder="Search name, position, phone…" value="${esc(ui.sQ)}" data-inp="sQ">
  </div>
  <div class="free-row ${freeOn ? 'on' : ''}"><span class="eyebrow">Who’s free</span><span class="muted">from</span><input class="input" type="date" value="${esc(ui.freeFrom)}" data-chg="freeFrom" aria-label="Free from"><span class="muted">to</span><input class="input" type="date" value="${esc(ui.freeTo)}" data-chg="freeTo" aria-label="Free to">
    ${freeOn ? `<span style="color:var(--green);font-weight:600">${plural(list.length, 'person', 'people')} free for all ${plural(daysIn(ui.freeFrom, ui.freeTo), 'day')}</span><button class="btn sm ghost" data-act="freeClear">Clear</button>` : '<span class="dim" style="font-size:12px">Pick dates to see only people with no bookings or leave then.</span>'}</div>
  ${list.length ? `<div style="max-width:1040px">${list.map(s => {
    const bs = idx().byStaff.get(s.id) || [], now = bs.find(a => a.from <= t && a.to >= t), next = bs.find(a => a.from > t);
    const away = (s.away || []).find(w => w.from && t >= w.from && t <= (w.to || w.from));
    const booked30 = bs.reduce((n, a) => { const f = a.from > t ? a.from : t, e = a.to < addDays(t, 29) ? a.to : addDays(t, 29); return n + Math.max(0, daysIn(f, e)); }, 0);
    return `<div class="crow ${s.active === false ? 'off' : ''}" data-act="staff" data-id="${esc(s.id)}">
      ${avatar(s.id, true)}
      <div style="min-width:0"><div class="nm">${esc(s.name)}${s.active === false ? ' <span class="dim">(inactive)</span>' : ''}</div>
        <div class="sub"><span>${esc(s.title || '—')}</span>${(s.skills || []).length ? `<span class="dim">+ ${esc(s.skills.join(', '))}</span>` : ''}<span class="tag">${esc(label(STAFF_TYPES, s.type || 'employee'))}${s.agency ? ' · ' + esc(s.agency) : ''}</span><span class="tag">${esc(s.dept || deptOf(s.title) || 'Other')}</span>${s.city ? `<span>${esc(s.city)}</span>` : ''}
        ${now ? `<span class="issue info">On ${esc(getProject(now.projectId)?.code || projName(now.projectId))} until ${esc(fmtShort(now.to))}</span>` : away ? `<span class="issue warn">On leave until ${esc(fmtShort(away.to || away.from))}</span>` : '<span class="issue ok">Free today</span>'}</div></div>
      <div class="right"><div><div class="num" style="color:var(--text);font-weight:600">${rateHTML(s.rateType, s.rate)}</div><div class="hide-sm">${next ? `Next: ${esc(getProject(next.projectId)?.code || projName(next.projectId))} · ${esc(fmtShort(next.from))}` : 'Nothing booked ahead'} · ${booked30}/30 days booked</div></div></div>
    </div>`;
  }).join('')}</div>` : all.length ? `<div class="empty"><b>No one matches</b>${freeOn ? 'Everyone is booked or on leave on some of those days.' : 'Try another filter or search.'}</div>`
    : `<div class="empty"><b>No staff yet</b>Add your team with their positions and rates — or paste a list from a spreadsheet.<br><br><button class="btn primary" data-act="newStaff">${ICON.plus} Add staff</button> <button class="btn" data-act="importStaff">Import list</button></div>`}`;
}

/* =========================================================================
   Forms & drawer
   ========================================================================= */
const getPath = (o, k) => k.split('.').reduce((v, p) => v?.[p], o);
const setPath = (o, k, v) => { const ps = k.split('.'); let c = o; ps.slice(0, -1).forEach(p => c = c[p] ||= {}); c[ps.at(-1)] = v; };
function formHTML(fields, values = {}) {
  return fields.map(f => {
    if (f.sect) return `<div class="sect eyebrow">${esc(f.sect)}</div>`;
    if (f.html) return `<div class="f ${f.span ? 'span' : ''}">${f.html}</div>`;
    const v = getPath(values, f.k) ?? f.default ?? '';
    const id = 'f_' + f.k.replace(/\./g, '_');
    let ctl;
    if (f.type === 'select') ctl = `<select class="input" id="${id}" data-k="${f.k}">${f.options.map(([ov, ol]) => `<option value="${esc(ov)}" ${String(v) === String(ov) ? 'selected' : ''}>${esc(ol)}</option>`).join('')}</select>`;
    else if (f.type === 'textarea') ctl = `<textarea class="input" id="${id}" data-k="${f.k}" placeholder="${esc(f.placeholder || '')}">${esc(v)}</textarea>`;
    else ctl = `<input class="input" id="${id}" data-k="${f.k}" type="${f.type || 'text'}" value="${esc(v)}" placeholder="${esc(f.placeholder || '')}" ${f.list ? `list="${f.list}"` : ''} ${f.min != null ? `min="${f.min}"` : ''} ${f.step ? `step="${f.step}"` : ''}>`;
    return `<div class="f ${f.span ? 'span' : ''}"><label for="${id}">${esc(f.label)}</label>${ctl}${f.hint ? `<span class="dim" style="font-size:12px">${f.hint}</span>` : ''}</div>`;
  }).join('');
}
function readForm(el, base = {}) {
  const o = structuredClone(base);
  el.querySelectorAll('[data-k]').forEach(i => { let v = i.value.trim(); if (i.type === 'number') v = v === '' ? '' : Number(v); setPath(o, i.dataset.k, v); });
  return o;
}
const datalists = () => `<datalist id="dlTitles">${TITLE_NAMES.map(r => `<option value="${esc(r)}">`).join('')}</datalist>`;
const allowanceFields = (per = 'per person') => [

  { k: 'rate', label: `Rate (${CONFIG.CURRENCY})`, type: 'number', min: 0 },

  { k: 'accommodation', label: `Accommodation (${CONFIG.CURRENCY} total ${per})`, type: 'number', min: 0 },

let drawerState = null;
