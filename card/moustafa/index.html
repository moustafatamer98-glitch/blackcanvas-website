<style>
/* Layout: one phone-width column — the card back as hero, a hold-to-warm tagline, a scannable contact code, then contact rows. Single dark look, the brand's stage black. */
:root{
  --stage:#0B0B0C; --panel:#161618; --line:#3A3A3F; --ghost:#2E2E33;
  --bone:#F4F3EF; --muted:#B5B4B0; --ember:#F04E23; --ink:#0B0B0C;
  --f-display:"Archivo","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html{background:var(--stage)}
body{background:var(--stage);color:var(--bone);font-family:var(--f-display);font-size:16px;line-height:1.5;padding-inline:16px;-webkit-font-smoothing:antialiased}
.wrap{max-width:420px;margin:0 auto;padding-block:20px 40px;display:flex;flex-direction:column;gap:20px}
.display{font-stretch:76%;font-weight:900;text-transform:uppercase;line-height:.88;letter-spacing:-.02em;word-spacing:.12em}
.mono{font-family:var(--f-mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase}
.sq{display:inline-block;width:.24em;height:.24em;background:var(--ember);margin-left:.07em}
.outline{color:transparent;-webkit-text-stroke:max(1px,.026em) var(--bone)}

/* top bar */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.lockup{font-size:24px}
.lockup .lc{padding-left:1.1em}
.people{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.people button{all:unset;cursor:pointer;font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);padding:9px 10px;min-height:20px;transition:color .2s,border-color .2s,background .2s}
.people button:hover{color:var(--bone);border-color:var(--muted)}
.people button[aria-selected="true"]{background:var(--ember);border-color:var(--ember);color:var(--ink)}
.people button:focus-visible{outline:2px solid var(--ember);outline-offset:2px}

/* hero = the card back */
.hero{position:relative;overflow:hidden;background:var(--stage);border:1px solid var(--line);aspect-ratio:90/50;max-width:100%;container-type:inline-size}
.tex{position:absolute;inset:4% 4%;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
.tex span{font-family:var(--f-display);font-stretch:76%;font-weight:900;text-transform:uppercase;line-height:.88;color:transparent;-webkit-text-stroke:1.2px var(--ghost)}
.hero-in{position:relative;height:100%;box-sizing:border-box;padding:6.5cqw 6.5cqw 5.3cqw;display:flex;flex-direction:column;justify-content:space-between}
.name{font-size:9.5cqw;line-height:.9}
.name .last{display:block;padding-left:1.1em}
.role{color:var(--ember);font-size:2.9cqw;margin-top:2.4cqw}
.hero-foot{display:flex;justify-content:space-between;align-items:flex-end;font-family:var(--f-mono);font-size:2.7cqw;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}


/* scan to save */
.scan{background:var(--bone);color:var(--ink);padding:18px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center}
.scan{align-items:center}.scan h2{margin:0;font-size:26px;text-wrap:balance}
.scan p{margin:8px 0 0;font-size:14px;line-height:1.45;color:#45454A}
.qr{width:132px;height:132px;max-width:100%;background:var(--bone)}
.qr svg{display:block;width:100%;height:100%}
@media (max-width:360px){.scan{grid-template-columns:1fr}.qr{width:180px;height:180px;justify-self:center}}

/* contact rows */
.rows{list-style:none;margin:0;padding:0;border-top:1.5px solid var(--bone)}
.rows li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.rows .k{color:var(--muted);font-size:11px}
.rows .v{grid-column:1;font-family:var(--f-mono);font-size:13.5px;letter-spacing:.02em;color:var(--bone);word-break:break-all;user-select:all;-webkit-user-select:all}
.rows .acts{grid-column:2;grid-row:1 / span 2;display:flex;gap:6px}
.rows a,.rows button{all:unset;box-sizing:border-box;cursor:pointer;min-width:44px;height:44px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--bone);transition:background .2s,border-color .2s,color .2s}
.rows a:hover,.rows button:hover{border-color:var(--ember);color:var(--ember)}
.rows a:focus-visible,.rows button:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
.rows button.ok{background:var(--ember);border-color:var(--ember);color:var(--ink)}

.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:11px}
.foot a{color:var(--muted);text-decoration:none}
.foot a:hover{color:var(--bone)}

@media (prefers-reduced-motion:reduce){.people button,.rows a,.rows button{transition:none}}

.save{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;background:var(--ember);color:var(--ink);text-decoration:none;font-family:var(--f-mono);font-size:13px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;transition:background .2s}
.save:hover{background:#FF6A3D}
.save:focus-visible{outline:2px solid var(--bone);outline-offset:3px}
.wrap{padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
</style>
